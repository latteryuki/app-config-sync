name: Daily Assets Sync

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build assets
        run: |
          set -ef -o pipefail
          mkdir -p dist
          
          VERSION=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.tag_name')
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-${VERSION}.gz" -o core.gz
          gunzip core.gz
          chmod +x core

          for name in reject icloud apple google proxy direct private gfw tld-not-cn; do
            curl -fsSL "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/${name}.txt" -o "${name}.yaml"
            ./core convert-ruleset domain yaml "${name}.yaml" "dist/${name}.mrs" > /dev/null
          done

          for name in telegramcidr cncidr lancidr; do
            curl -fsSL "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/${name}.txt" -o "${name}.yaml"
            ./core convert-ruleset ipcidr yaml "${name}.yaml" "dist/${name}.mrs" > /dev/null
          done

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: release
          force_orphan: true
          commit_message: "chore: update assets"
